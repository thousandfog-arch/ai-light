name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build Claude Code hook helper
        run: cargo build -p ai-light-hook --release

      - name: Build Tauri Windows app and installers
        run: npx --yes @tauri-apps/cli@2.11.2 build

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-light-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            target/release/ai-light.exe
            target/release/ai-light-hook.exe
            target/release/WebView2Loader.dll
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
